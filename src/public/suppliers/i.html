<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codlinx - Fornecedor</title>
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/codlinx.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">

    <script src="../assets/js/vue.min.js"></script>
    <script src="../assets/js/jquery-3.6.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/axios.min.js"></script>
    <script src="../assets/js/moment.min.js"></script>
</head>

<body>
    <nav class="navbar bg-light">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <img src="../assets/img/logo_cabecalho.png" alt="Codlinx" width="40" height="40">
            </a>
        </div>
    </nav>

    <div class="container p-4" id="app">

        <h5>Fornecedor #{{ id }}</h5>
        <hr>

        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="intlToggle" v-model="isInternational">
            <label class="form-check-label" for="intlToggle">Fornecedor internacional (sem CNPJ)</label>
        </div>

        <form @submit.prevent="saveSupplier">
            <div class="row mb-3" v-if="!isInternational">
                <div class="col-md-6">
                    <label class="form-label">CNPJ</label>
                    <div class="input-group">
                        <input type="text" class="form-control" v-model="cnpj" @keyup="maskCnpj"
                            placeholder="00.000.000/0000-00">
                        <button type="button" class="btn btn-outline-secondary" @click="lookupCnpj"
                            :disabled="cnpjLookupLoading">
                            <i class="fa-solid fa-spinner fa-spin" v-if="cnpjLookupLoading"></i>
                            <span v-else><i class="fa-solid fa-magnifying-glass"></i> Buscar</span>
                        </button>
                    </div>
                    <div class="form-text">Busca automaticamente nome, e-mail e telefone.</div>
                </div>
            </div>
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label class="form-label">Nome / Razão Social</label>
                    <input type="text" class="form-control" v-model="name" required>
                </div>
                <div class="mb-3 col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" v-model="email">
                </div>
            </div>
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label class="form-label">Telefone</label>
                    <input type="text" class="form-control" v-model="phone">
                </div>
            </div>
            <div class="row">
                <div class="mb-3 col-md-3">
                    <label class="form-label">% de comissão padrão</label>
                    <input type="number" step="0.01" min="0" max="100" class="form-control" v-model="default_commission_percent" placeholder="Ex: 15">
                </div>
                <div class="mb-3 col-md-3">
                    <label class="form-label">Prazo para pagar a comissão (dias)</label>
                    <input type="number" min="0" class="form-control" v-model.number="commission_payment_days">
                </div>
                <div class="mb-3 col-md-3">
                    <label class="form-label">Condição padrão dos repasses</label>
                    <input type="text" class="form-control" v-model="default_payment_terms" placeholder="ex.: 15/30/60">
                </div>
                <div class="mb-3 col-md-3 d-flex align-items-end">
                    <div class="form-text pb-2">Usados em protocolos por comissão (o fornecedor cobra o cliente e paga a comissão). A % é só sugestão: o valor pode ser informado na mão no protocolo.</div>
                </div>
            </div>
            <button type="submit" class="btn btn-dark">Salvar fornecedor</button>
            <a href="./index.html" class="btn btn-secondary ms-2">Voltar</a>
        </form>
        <hr>
        <button v-if="id" @click="deleteSupplier" class="btn btn-danger">Excluir Fornecedor</button>
    </div>

    <script src="../assets/js/suppliers/i.js"></script>
    <script src="../assets/js/nav.js"></script>
</body>

</html>
