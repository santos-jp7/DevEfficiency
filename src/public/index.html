<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Codlinx</title>

        <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="../assets/css/codlinx.css" />

        <script src="../assets/js/vue.min.js"></script>
        <script src="../assets/js/axios.min.js"></script>
    </head>

    <body>
        <div class="cx-login-wrap" id="login">
            <div class="cx-login-brand">
                <img src="./assets/img/logo_cabecalho.png" alt="Codlinx" class="cx-login-brand__logo" />
                <h1 class="cx-login-brand__headline">Gestão que<br>respeita seu tempo.</h1>
                <p class="cx-login-brand__sub">Ordens de serviço, faturamento, assinaturas e financeiro — tudo em um só lugar.</p>
            </div>

            <div class="cx-login-form">
                <div class="cx-login-form__inner">
                    <p class="cx-login-form__title">Entrar na conta</p>
                    <p class="cx-login-form__sub">Use suas credenciais de acesso.</p>

                    <form @submit="handlerSubmit">
                        <div class="mb-3">
                            <label class="form-label" for="inputLogin">Usuário</label>
                            <input type="text" class="form-control" id="inputLogin" v-model="username" autocomplete="username" />
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="inputPassword">Senha</label>
                            <input type="password" class="form-control" id="inputPassword" v-model="password" autocomplete="current-password" />
                        </div>
                        <button type="submit" class="btn btn-dark">Acessar o sistema</button>
                    </form>
                </div>
            </div>
        </div>

        <script src="./assets/js/login.js"></script>
    </body>
</html>
