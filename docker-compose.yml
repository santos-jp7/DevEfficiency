version: '3.8'

services:
    mysqldb:
        image: mysql:8.4.8
        restart: unless-stopped
        env_file: ./.env
        environment:
            - MYSQL_ROOT_PASSWORD=$DB_PASS
            - MYSQL_DATABASE=$DB_NAME
        volumes:
            - db8:/var/lib/mysql
        networks:
            - devefficiency
    app:
        depends_on:
            - mysqldb
        build: ./
        restart: unless-stopped
        env_file: ./.env
        ports:
            - $PORT:$PORT
        environment:
            - DB_HOST=mysqldb
            - DB_USER=root
            - DB_PASS=$DB_PASS
            - DB_NAME=$DB_NAME
        stdin_open: true
        tty: true
        networks:
            - devefficiency

volumes:
    db8:

networks:
    devefficiency:
        external: true
